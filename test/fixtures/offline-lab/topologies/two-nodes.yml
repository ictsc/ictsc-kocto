name: kocto-offline
mgmt:
  network: kocto-offline-mgmt
  ipv4-subnet: 172.30.100.0/24
topology:
  nodes:
    host1:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 172.30.100.11
      binds: ["../configs:/kocto:ro"]
      exec:
        - ip addr replace 10.10.10.1/24 dev eth1
    host2:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 172.30.100.12
      exec:
        - ip addr replace 10.10.10.2/24 dev eth1
  links:
    - endpoints: ["host1:eth1", "host2:eth1"]
