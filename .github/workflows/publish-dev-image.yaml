name: Publish and deploy development image

on:
  push:
    branches-ignore:
      - dev-deploy
  # Merges made with GITHUB_TOKEN (for example by the auto-merge workflow) do
  # not trigger push workflows, so that workflow dispatches this one instead.
  workflow_dispatch:

concurrency:
  # Bot branches get their own group so that their runs, which only skip the
  # job, cannot cancel a deploy that is already running.
  group: "ictsc-kocto-dev-environment-${{ (startsWith(github.ref_name, 'dependabot/') || startsWith(github.ref_name, 'renovate/')) && 'bots' || 'branches' }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-and-render:
    # Bot pushes publish an image and rewrite dev-deploy, which syncs an
    # unreviewed dependency branch into the shared development cluster. Skip
    # them; a reviewed merge to main still deploys as before.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read the Go release series
        id: go-version
        run: awk '/^go / { split($2, v, "."); print "version=" v[1] "." v[2] ".x"; exit }' go.mod >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          check-latest: true
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 controller image
        id: controller-image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ictsc/ictsc-kocto:${{ github.sha }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      - name: Build and push amd64 bundle builder image
        id: bundle-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/bundle/Dockerfile
          build-args: VCS_REF=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ictsc/ictsc-kocto-bundle-builder:${{ github.sha }}
          cache-from: type=gha,scope=bundle-builder
          cache-to: type=gha,mode=max,scope=bundle-builder

      - name: Execute and inspect the published bundle builder
        env:
          BUILDER_IMAGE: ghcr.io/ictsc/ictsc-kocto-bundle-builder@${{ steps.bundle-image.outputs.digest }}
          BUNDLE_TEST_REPOSITORY: https://github.com/${{ github.repository }}
          BUNDLE_TEST_COMMIT: ${{ github.sha }}
        run: |
          docker pull "$BUILDER_IMAGE"
          bash hack/test-bundle-builder.sh

      - name: Render development manifests
        env:
          DEV_IMAGE: ghcr.io/ictsc/ictsc-kocto:${{ github.sha }}
          BUNDLE_IMAGE: ghcr.io/ictsc/ictsc-kocto-bundle-builder@${{ steps.bundle-image.outputs.digest }}
          DEV_MANIFEST: ${{ runner.temp }}/ictsc-kocto.yaml
        run: |
          mkdir -p "$(dirname "$DEV_MANIFEST")"
          make manifests kustomize
          ./bin/kustomize build config/default \
            | python3 hack/set-dev-image.py "$DEV_IMAGE" ghcr-pull "$BUNDLE_IMAGE" ghcr-pull \
            > "$DEV_MANIFEST"

      - name: Publish manifests to the GitOps branch
        env:
          DEV_MANIFEST: ${{ runner.temp }}/ictsc-kocto.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads --exit-code origin dev-deploy >/dev/null; then
            git fetch origin refs/heads/dev-deploy:refs/remotes/origin/dev-deploy
            git switch --track --create dev-deploy origin/dev-deploy
          else
            git switch --orphan dev-deploy
          fi

          mkdir -p manifests
          cp "$DEV_MANIFEST" manifests/ictsc-kocto.yaml
          git add -- manifests/ictsc-kocto.yaml
          if git diff --cached --quiet; then
            echo "Rendered manifests are unchanged"
            exit 0
          fi
          git commit -m "Deploy source ${GITHUB_SHA} to dev"
          git push origin HEAD:refs/heads/dev-deploy
