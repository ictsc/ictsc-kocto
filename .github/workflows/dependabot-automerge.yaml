name: Dependabot auto-merge

# workflow_run waits for CI to finish and, unlike pull_request events from
# Dependabot, is not limited to a read-only GITHUB_TOKEN, so this job can merge.
# The workflow file must exist on the default branch for this event to fire.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7

      - name: Find the pull request
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base main --head "$HEAD_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check the update can be merged automatically
        id: gate
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.find.outputs.number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # REST reports "dependabot[bot]"; the CLI can use "app/dependabot".
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          author="$(jq -r .user.login <<< "$metadata")"
          case "$author" in
            dependabot\[bot\]|app/dependabot) ;;
            *)
              echo "Pull request #$PR was opened by $author"
              exit 0
              ;;
          esac
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$TESTED_SHA" \
            '.head.repo.full_name == $repo and .head.sha == $sha and .base.ref == "main"' \
            <<< "$metadata" > /dev/null; then
            echo "Pull request #$PR does not match the tested commit in this repository"
            exit 0
          fi
          head_branch="$(jq -r .head.ref <<< "$metadata")"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pull-request.diff"
          if hack/dependabot-automerge-gate.sh "$RUNNER_TEMP/pull-request.diff" "$head_branch"; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the pull request
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.find.outputs.number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$TESTED_SHA"
          echo "Merged pull request #$PR"

      # A merge made with GITHUB_TOKEN does not trigger push workflows, so the
      # development deploy for the new commit on main is dispatched explicitly.
      - name: Deploy the merged commit to the development cluster
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-dev-image.yaml --repo "$GITHUB_REPOSITORY" --ref main
