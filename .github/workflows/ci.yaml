name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reflink-csi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile applies the pinned upstream patch and runs its unit tests.
      # Shared physical extents are checked separately on the dev cluster's XFS.
      - name: Build and test the development storage driver
        uses: docker/build-push-action@v7
        with:
          context: config/dev-storage/reflink
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=reflink-csi
          cache-to: type=gha,mode=max,scope=reflink-csi

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Keep this on the same major as the publish workflow.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        run: make lint

      - name: Run unit tests
        run: make test

      # make test regenerates CRDs, DeepCopy code, formatting and vet output.
      # A dirty tree means generated artifacts were not committed.
      - name: Verify generated files are committed
        run: git diff --exit-code
