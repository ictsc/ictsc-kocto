name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read the Go release series
        id: go-version
        run: awk '/^go / { split($2, v, "."); print "version=" v[1] "." v[2] ".x"; exit }' go.mod >> "$GITHUB_OUTPUT"

      # Keep this on the same major as the publish workflow.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          check-latest: true
          cache: true

      - name: Test Dependabot auto-merge policy
        run: bash hack/test-dependabot-automerge-gate.sh

      - name: Run linter
        run: make lint

      - name: Run unit tests
        run: make test

      # make test regenerates CRDs, DeepCopy code, formatting and vet output.
      # A dirty tree means generated artifacts were not committed.
      - name: Verify generated files are committed
        run: git diff --exit-code
