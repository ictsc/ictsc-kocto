version: 2

updates:
  # Go modules. k8s.io/* and controller-runtime move together, and envtest's
  # Kubernetes version is derived from go.mod in the Makefile, so coupled
  # dependencies are grouped into a single reviewable pull request.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # Keep this identifier in sync with the auto-merge gate.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      testing:
        patterns:
          - github.com/onsi/ginkgo*
          - github.com/onsi/gomega
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"

  # Refresh the digest of the current Go series, including security patches.
  # Go toolchain releases are not covered by gomod security updates.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    allow:
      - dependency-name: golang
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
