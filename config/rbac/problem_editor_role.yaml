# This rule is not used by the project ictsc-kocto itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the lab.icttoracon.net.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ictsc-kocto
    app.kubernetes.io/managed-by: kustomize
  name: problem-editor-role
rules:
- apiGroups:
  - lab.icttoracon.net
  resources:
  - problems
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lab.icttoracon.net
  resources:
  - problems/status
  verbs:
  - get
