---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: problems.lab.icttoracon.net
spec:
  group: lab.icttoracon.net
  names:
    kind: Problem
    listKind: ProblemList
    plural: problems
    singular: problem
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Problemは問題環境を表すリソースです。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: specには、作成する問題環境の内容を指定します。
            properties:
              access:
                items:
                  description: AccessEndpointは、参加者が問題環境へ接続するためのエンドポイントを表します。
                  properties:
                    interface:
                      description: Interfaceはアクセスエンドポイントが接続されるインターフェースを指定する
                      type: string
                    name:
                      description: Nameはアクセスエンドポイントの名前を指定する
                      type: string
                    node:
                      description: Nodeはアクセスエンドポイントが接続されるノードを指定する
                      type: string
                  required:
                  - interface
                  - name
                  - node
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              machine:
                description: Machineは、問題環境を動かすVMのスペックを指定します。
                properties:
                  cpu:
                    description: CPUはマシンのCPUコア数を指定する
                    format: int32
                    minimum: 1
                    type: integer
                  disk:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Diskはマシンのディスク容量を指定する
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memoryはマシンのメモリ容量を指定する
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cpu
                - disk
                - memory
                type: object
              source:
                description: Sourceは、問題を定義するGitリポジトリやディレクトリの情報を指定します。
                properties:
                  ansiblePlaybook:
                    description: |-
                      AnsiblePlaybookは問題環境の構築に使用するAnsibleプレイブックを指定する
                      Directoryからの相対パスを指定する
                    type: string
                  commitHash:
                    description: CommitHashはGitリポジトリのコミットハッシュを指定する
                    type: string
                  directory:
                    description: |-
                      DirectoryはGitリポジトリ内のディレクトリを指定する
                      空の場合はリポジトリのルートディレクトリを指定する
                    type: string
                  repository:
                    description: RepositoryはGitリポジトリのURLを指定する
                    type: string
                  topologyFile:
                    description: |-
                      TopologyFileは問題環境のトポロジーファイルを指定する
                      Directoryからの相対パスを指定する
                    type: string
                required:
                - commitHash
                - repository
                - topologyFile
                type: object
            required:
            - access
            - machine
            - source
            type: object
          status:
            description: statusには、コントローラーが確認した現在の状態が入ります。
            properties:
              conditions:
                description: |-
                  Conditionsは、Problemの現在の状態を表します。
                  条件の種類ごとに状態を分け、True、False、Unknownで結果を示します。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
