apiVersion: lab.icttoracon.net/v1alpha1
kind: Problem
metadata:
  labels:
    app.kubernetes.io/name: ictsc-kocto
    app.kubernetes.io/managed-by: kustomize
  name: problem-sample
spec:
  source:
    repository: "https://github.com/example/repo.git"
    commitHash: "abcdef1234567890"
    directory: "problems/sample"
    topologyFile: "topology.yaml"
    ansiblePlaybook: "playbook.yaml"
  machine:
    cpu: 2
    memory: "4Gi"
    disk: "10Gi"
  access:
    - name: "web"
      node: "web-node"
      interface: "eth0"
