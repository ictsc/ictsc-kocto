apiVersion: lab.icttoracon.net/v1alpha1
kind: Problem
metadata:
  labels:
    app.kubernetes.io/name: ictsc-kocto
    app.kubernetes.io/managed-by: kustomize
  name: problem-sample
spec:
  source:
    repository: "https://github.com/example/repo.git"
    commitHash: "abcdef1234567890"
    directory: "problems/sample"
    topologyFile: "topology.yaml"
    ansiblePlaybook: "playbook.yaml"
  machine:
    cpu: 1
    memory: "128Mi"
    disk: "1Gi"
    image:
      containerDisk: "quay.io/kubevirt/cirros-container-disk-demo@sha256:9d36bdd2b8f86e37058a58be47f82c9e94e2741df8fc8144cecf80fd953c8643"
  access:
    - name: "web"
      node: "web-node"
      interface: "eth0"
