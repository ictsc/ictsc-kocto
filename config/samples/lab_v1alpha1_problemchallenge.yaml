apiVersion: lab.icttoracon.net/v1alpha1
kind: ProblemChallenge
metadata:
  labels:
    app.kubernetes.io/name: ictsc-kocto
    app.kubernetes.io/managed-by: kustomize
  name: problemchallenge-sample
spec:
  problemRef:
    name: problem-sample
  placement:
    # KubeVirtがVMを配置可能としたNodeを対象にします。特定Nodeへ絞る場合は、そのNodeだけのラベルへ置き換えてください。
    nodeSelector:
      kubevirt.io/schedulable: "true"
  teams:
    - id: "team-001"
    - id: "team-002"
