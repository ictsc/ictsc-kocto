apiVersion: lab.icttoracon.net/v1alpha1
kind: ProblemChallenge
metadata:
  labels:
    app.kubernetes.io/name: ictsc-kocto
    app.kubernetes.io/managed-by: kustomize
  name: problemchallenge-sample
spec:
  problemRef:
    name: problem-sample
  placement:
    # 対象のKubernetes Nodeだけに付いているラベルを指定します。
    nodeSelector:
      kubernetes.io/hostname: "test-talos-kocto-cp1"
  teams:
    - id: "team-001"
    - id: "team-002"
