apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: kocto-a220-san-block
spec:
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Block
  cloneStrategy: snapshot
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: kocto-a220-nas
spec:
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  cloneStrategy: snapshot
