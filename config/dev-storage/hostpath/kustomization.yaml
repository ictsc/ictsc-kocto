apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kocto-storage
resources:
  - storageclass.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-host-path/v1.18.0/deploy/kubernetes-1.34/hostpath/csi-hostpath-plugin.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-host-path/v1.18.0/deploy/kubernetes-1.34/hostpath/csi-hostpath-driverinfo.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-provisioner/v6.3.0/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-attacher/v4.12.0/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-resizer/v2.2.1/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/deploy/kubernetes/csi-snapshotter/rbac-csi-snapshotter.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-health-monitor/v0.18.0/deploy/kubernetes/external-health-monitor-controller/rbac.yaml
images:
  - name: registry.k8s.io/sig-storage/hostpathplugin
    newTag: v1.18.0
patches:
  - target:
      kind: ClusterRoleBinding
      name: csi-hostpathplugin-snapshot-metadata-cluster-role
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: csi-hostpathplugin-snapshot-metadata-cluster-role
  - target:
      kind: StatefulSet
      name: csi-hostpathplugin
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/2/ports/0/name
        value: registrar-probe
      - op: replace
        path: /spec/template/spec/containers/2/livenessProbe/httpGet/port
        value: registrar-probe
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: test-talos-kocto-cp1
      - op: replace
        path: /spec/template/spec/volumes/4/hostPath/path
        value: /var/lib/kubelet/kocto-csi
