apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kocto-ceph-storage
resources:
  - namespace.yaml
  - storageclass.yaml
  - storageclass-block.yaml
  - storageprofile.yaml
  - storageprofile-block.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/rbd/kubernetes/csidriver.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/rbd/kubernetes/csi-provisioner-rbac.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/rbd/kubernetes/csi-nodeplugin-rbac.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/rbd/kubernetes/csi-rbdplugin-provisioner.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/rbd/kubernetes/csi-rbdplugin.yaml
  - https://raw.githubusercontent.com/ceph/ceph-csi/v3.18.1/deploy/ceph-conf.yaml
configMapGenerator:
  - name: ceph-csi-config
    files:
      - config.json
  - name: ceph-csi-encryption-kms-config
    literals:
      - config.json={}
generatorOptions:
  disableNameSuffixHash: true
replicas:
  - name: csi-rbdplugin-provisioner
    count: 1
patches:
  # TalosではSELinuxを使わず、/etcは読み取り専用なのでホスト側にディレクトリを作らない。
  - target:
      kind: DaemonSet
      name: csi-rbdplugin
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: csi-rbdplugin
      spec:
        template:
          spec:
            tolerations:
              - operator: Exists
            volumes:
              - name: etc-selinux
                hostPath: null
                emptyDir: {}
              - name: ceph-logdir
                hostPath:
                  path: /var/lib/kubelet/kocto-ceph-log
                  type: DirectoryOrCreate
  - target:
      kind: Deployment
      name: csi-rbdplugin-provisioner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: csi-rbdplugin-provisioner
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        template:
          spec:
            tolerations:
              - operator: Exists
  # 単一ディスクのSnapshotだけを使う。上流で有効なGroupSnapshotはCRDを導入していない。
  - target:
      kind: Deployment
      name: csi-rbdplugin-provisioner
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/2/args/5
        value: --feature-gates=CSIVolumeGroupSnapshot=false
