              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: specには、作成する問題環境の内容を指定します。
            properties:
              access:
                items:
                  description: AccessEndpointは、参加者が問題環境へ接続するためのエンドポイントを表します。
                  properties:
                    interface:
                      description: Interfaceはアクセスエンドポイントが接続されるインターフェースを指定する
                      type: string
                    name:
                      description: Nameはアクセスエンドポイントの名前を指定する
                      type: string
                    node:
                      description: Nodeはアクセスエンドポイントが接続されるノードを指定する
                      type: string
                  required:
                  - interface
                  - name
                  - node
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              machine:
                description: Machineは、問題環境を動かすVMのスペックを指定します。
                properties:
                  cpu:
                    description: CPUはマシンのCPUコア数を指定する
                    format: int32
                    minimum: 1
                    type: integer
                  disk:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Diskはマシンのディスク容量を指定する
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
