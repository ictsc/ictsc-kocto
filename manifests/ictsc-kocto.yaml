apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: problemchallenges.lab.icttoracon.net
spec:
  group: lab.icttoracon.net
  names:
    kind: ProblemChallenge
    listKind: ProblemChallengeList
    plural: problemchallenges
    singular: problemchallenge
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProblemChallengeは、ある出題機会における全チーム分の問題環境を表すリソースです。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: specには、出題するProblem、配置条件、対象チームを指定します。
            properties:
              placement:
                description: Placementは、この出題機会に作成するすべてのVMの配置条件を指定します。
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelectorは、KubeVirtのVMを実行するKubernetes Nodeをラベルで絞り込みます。
                      すべてのチーム環境を同じNodeに配置するには、対象Nodeだけに付けたラベルを指定してください。
                    minProperties: 1
                    type: object
                required:
                - nodeSelector
                type: object
              problemRef:
                description: |-
                  ProblemRefは、出題するProblemの名前を指定します。
                  ProblemChallengeと同じnamespaceにあるProblemを参照します。
                properties:
                  name:
                    description: Nameは、参照するProblemの名前を指定します。
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              teams:
                description: |-
                  Teamsは、この出題機会に問題環境を作成するチームの一覧です。
                  チームごとに1つの問題環境を作成します。
                items:
                  description: ProblemChallengeTeamSpecは、問題環境を作成するチームを表します。
                  properties:
                    id:
                      description: IDは、チームを識別する一意なIDを指定します。
                      minLength: 1
                      type: string
                  required:
                  - id
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
            required:
            - placement
            - problemRef
            - teams
            type: object
          status:
            description: statusには、コントローラーが確認した現在の状態が入ります。
            properties:
              conditions:
                description: |-
                  Conditionsは、ProblemChallengeの状態を種類ごとに表します。
                  各条件は異なる側面の状態を示し、種類ごとに1つ設定します。

                  よく使われる条件の種類には、次のものがあります。
                  - "Available": リソースが利用可能な状態
                  - "Progressing": リソースを作成または更新している状態
                  - "Degraded": リソースが期待した状態にならない、または維持できない状態

                  各条件の状態にはTrue、False、Unknownのいずれかを設定します。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
