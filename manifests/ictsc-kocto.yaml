                required:
                - generation
                - name
                - uid
                type: object
              teams:
                description: Teamsは、各チームの問題環境の状態を表します。
                items:
                  description: ProblemChallengeTeamStatusは、各チームの問題環境の状態を表します。
                  properties:
                    cloneRef:
                      description: CloneRefは、チーム用のVirtualMachineCloneへの参照を示します。
                      properties:
                        name:
                          description: Nameは、参照するリソースの名前を記録します。
                          minLength: 1
                          type: string
                        uid:
                          description: UIDは、参照するリソースのUIDを記録します。
                          minLength: 1
                          type: string
                      required:
                      - name
                      - uid
                      type: object
                    conditions:
                      description: Conditionsは、チームの問題環境の状態を種類ごとに表します。
                      items:
                        description: Condition contains details for one aspect of
