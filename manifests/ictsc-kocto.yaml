apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: problems.lab.icttoracon.net
spec:
  group: lab.icttoracon.net
  names:
    kind: Problem
    listKind: ProblemList
    plural: problems
    singular: problem
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Problemは問題環境を表すリソースです。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: specには、作成する問題環境の内容を指定します。
            properties:
              access:
                items:
                  description: AccessEndpointは、参加者が問題環境へ接続するためのエンドポイントを表します。
                  properties:
                    interface:
                      description: Interfaceはアクセスエンドポイントが接続されるインターフェースを指定する
                      type: string
                    name:
                      description: Nameはアクセスエンドポイントの名前を指定する
                      type: string
                    node:
                      description: Nodeはアクセスエンドポイントが接続されるノードを指定する
                      type: string
                  required:
                  - interface
                  - name
                  - node
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              machine:
                description: Machineは、問題環境を動かすVMのスペックを指定します。
                properties:
                  cpu:
                    description: CPUはマシンのCPUコア数を指定する
                    format: int32
                    minimum: 1
                    type: integer
                  disk:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Diskは初回取り込み時のroot PVCの要求容量を指定する。
                      作成後は変更できない。
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: machine.diskは有効なQuantityで0より大きい値にしてください
                      rule: isQuantity(string(self)) && quantity(string(self)).isGreaterThan(quantity('0'))
                    - message: machine.diskは変更できません
                      rule: self == oldSelf
                  image:
                    description: |-
                      Imageは、初回取り込み元のイメージを指定する。
                      作成後は変更できない。
                    properties:
                      containerDisk:
                        description: ContainerDiskは、VMの起動元として使うコンテナディスクイメージを指定する
                        minLength: 1
                        type: string
                    required:
                    - containerDisk
                    type: object
                    x-kubernetes-validations:
                    - message: machine.imageは変更できません
                      rule: self == oldSelf
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Memoryは固定のメモリ量を指定する。balloonを明示的に有効にする場合は省略する。
                      省略したmemoryBalloonは従来どおりゲスト量と要求量を揃え、デバイスの既定値も維持する。
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: machine.memoryは有効なQuantityで0より大きい値にしてください
                      rule: isQuantity(string(self)) && quantity(string(self)).isGreaterThan(quantity('0'))
                  memoryBalloon:
                    description: MemoryBalloonはvirtio-balloonの有効/無効と、ゲスト量と配置要求量を指定する。
                    properties:
                      enabled:
                        description: Enabledはvirtio-balloonデバイスを接続するかを指定する。
                        type: boolean
                      max:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Maxはゲストに見せるメモリ量。memory.maxGuestによるhotplug上限ではない。
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                        x-kubernetes-validations:
                        - message: memoryBalloon.maxは有効なQuantityで0より大きい値にしてください
                          rule: isQuantity(string(self)) && quantity(string(self)).isGreaterThan(quantity('0'))
                      min:
                        anyOf:
                        - type: integer
                        - type: string
                        description: MinはKubernetesへ要求するメモリ量。KubeVirtの追加分は別に加算される。
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                        x-kubernetes-validations:
                        - message: memoryBalloon.minは有効なQuantityで0より大きい値にしてください
                          rule: isQuantity(string(self)) && quantity(string(self)).isGreaterThan(quantity('0'))
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
                    - message: memoryBalloonが有効な場合はminとmaxが必須で、無効な場合は指定できません
                      rule: 'self.enabled ? has(self.min) && has(self.max) : !has(self.min)
                        && !has(self.max)'
                    - message: memoryBalloon.minはmax以下にしてください
                      rule: '!has(self.min) || !has(self.max) || !isQuantity(string(self.min))
                        || !isQuantity(string(self.max)) || !quantity(string(self.min)).isGreaterThan(quantity(string(self.max)))'
                required:
                - cpu
                - disk
                - image
                type: object
                x-kubernetes-validations:
                - message: memoryBalloonが有効な場合はmemoryを省略し、それ以外はmemoryが必須です
                  rule: 'has(self.memoryBalloon) && self.memoryBalloon.enabled ? !has(self.memory)
                    : has(self.memory)'
              source:
                description: Sourceは、問題を定義するGitリポジトリやディレクトリの情報を指定します。
                properties:
                  ansiblePlaybook:
                    description: |-
                      AnsiblePlaybookは問題環境の構築に使用するAnsibleプレイブックを指定する
                      Directoryからの相対パスを指定する
                    type: string
                  commitHash:
                    description: CommitHashはGitリポジトリのコミットハッシュを指定する
                    type: string
                  directory:
                    description: |-
                      DirectoryはGitリポジトリ内のディレクトリを指定する
                      空の場合はリポジトリのルートディレクトリを指定する
                    type: string
                  repository:
                    description: RepositoryはGitリポジトリのURLを指定する
                    type: string
                  topologyFile:
                    description: |-
                      TopologyFileは問題環境のトポロジーファイルを指定する
                      Directoryからの相対パスを指定する
                    type: string
                required:
                - commitHash
                - repository
                - topologyFile
                type: object
              storage:
                description: |-
                  Storageは初回取り込み先を指定する。省略時はmanagerのStorageClassとFilesystemを使う。
                  既存Problemへの後付けや削除は禁止し、作問済みのディスクを別の構成へ切り替えない。
                properties:
                  storageClassName:
                    description: StorageClassNameは初回取り込み先のStorageClass名を指定する。
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  volumeMode:
                    description: VolumeModeはFilesystemまたはBlockを指定する。作成後に変換しない。
                    enum:
                    - Filesystem
                    - Block
                    type: string
                required:
                - storageClassName
                - volumeMode
                type: object
                x-kubernetes-validations:
                - message: storageは変更できません
                  rule: self == oldSelf
            required:
            - access
            - machine
            - source
            type: object
            x-kubernetes-validations:
            - message: storageはProblemの作成後に追加や削除ができません
              rule: has(self.storage) == has(oldSelf.storage)
          status:
            description: statusには、コントローラーが確認した現在の状態が入ります。
            properties:
              activeChallenge:
                description: ActiveChallengeは、ロックを所有するChallengeの情報を記録します。
                properties:
                  activeChallengeName:
                    description: ActiveChallengeNameは、ロックを所有するChallengeの情報を示します。
                    minLength: 1
                    type: string
                  problemGeneration:
                    description: ProblemGenerationは、ロック取得時のProblemの世代を指定します。
                    format: int64
                    type: integer
                  uid:
                    description: UIDは、現在アクティブなChallengeのUIDを指定します。
                    minLength: 1
                    type: string
                required:
                - activeChallengeName
                - problemGeneration
                - uid
                type: object
              conditions:
                description: |-
                  Conditionsは、Problemの現在の状態を表します。
                  条件の種類ごとに状態を分け、True、False、Unknownで結果を示します。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              diskRef:
                description: DiskRefは、初回取り込みを管理するDataVolumeの名前とUIDを記録します。
                properties:
                  diskName:
                    description: Nameは、初回取り込みを管理するDataVolumeの名前を指定します。
                    minLength: 1
                    type: string
                  pvcUID:
                    description: |-
                      PVCUIDは、作問データを保持するPVCのUIDを指定します。
                      古いstatusにこの値がない場合は、controllerが現在のPVCを一度だけ記録します。
                    minLength: 1
                    type: string
                  uid:
                    description: UIDは、初回取り込みを管理するDataVolumeのUIDを指定します。
                    minLength: 1
                    type: string
                required:
                - diskName
                - uid
                type: object
              vmRef:
                description: VMRefは、管理する作問VMの名前とUIDを記録します。
                properties:
                  uid:
                    description: UIDは、管理する作問VMのUIDを指定します。
                    minLength: 1
                    type: string
                  vmName:
                    description: Nameは、管理する作問VMの名前を指定します。
                    minLength: 1
                    type: string
                required:
                - uid
                - vmName
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: ProblemのspecはChallengeによるロック中は変更できません
          rule: '!has(oldSelf.status) || !has(oldSelf.status.activeChallenge) || self.spec
            == oldSelf.spec'
    served: true
    storage: true
    subresources:
      status: {}
