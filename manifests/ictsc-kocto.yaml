                    - uid
                    type: object
                  volumeSnapshotRef:
                    description: VolumeSnapshotRefは、rootディスクのCSI VolumeSnapshotを示す。同じnamespaceにある。
                    properties:
                      name:
                        description: Nameは、参照するリソースの名前を記録します。
                        minLength: 1
                        type: string
                      uid:
                        description: UIDは、参照するリソースのUIDを記録します。
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                required:
                - name
                - uid
                type: object
              sourceProblem:
                description: SourceProblemは、出題元のProblemを示します
                properties:
                  diskPVCUID:
                    description: |-
                      DiskPVCUIDは、Challengeが受け入れた時点の作問ディスクPVCのUIDを記録します。
                      古いChallengeのstatusでは省略される場合があります。
                    minLength: 1
                    type: string
                  generation:
                    description: Generationは、ロック取得時のProblemのgenerationを記録します。
                    format: int64
                    type: integer
                  name:
                    description: Nameは、参照するProblemの名前を指定します。
                    minLength: 1
                    type: string
                  uid:
                    description: UIDは、参照するProblemのUIDを指定します。
                    minLength: 1
