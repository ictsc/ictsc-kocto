                        minLength: 1
                        type: string
                      uid:
                        description: UIDは、参照するリソースのUIDを記録します。
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  name:
                    description: Nameは、参照するスナップショットの名前を指定します。
                    minLength: 1
                    type: string
                  uid:
                    description: UIDは、参照するスナップショットのUIDを指定します。
                    minLength: 1
                    type: string
                  volumeSnapshotContentRef:
                    description: |-
                      VolumeSnapshotContentRefは、rootディスクのCSI VolumeSnapshotContentを示す。
                      このリソースはクラスタ全体に属するため、namespaceを指定せずに参照する。
                    properties:
                      name:
