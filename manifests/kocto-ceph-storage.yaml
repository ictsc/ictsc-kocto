apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-rbdplugin-provisioner
  namespace: kocto-ceph-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-rbdplugin-provisioner
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: csi-rbdplugin-provisioner
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - csi-rbdplugin-provisioner
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --nodeid=$(NODE_ID)
        - --type=rbd
        - --controllerserver=true
        - --endpoint=$(CSI_ENDPOINT)
        - --csi-addons-endpoint=$(CSI_ADDONS_ENDPOINT)
        - --v=5
        - --drivername=rbd.csi.ceph.com
        - --pidlimit=-1
        - --rbdhardmaxclonedepth=8
        - --rbdsoftmaxclonedepth=4
        - --enableprofiling=false
        - --setmetadata=true
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CSI_ENDPOINT
          value: unix:///csi/csi-provisioner.sock
        - name: CSI_ADDONS_ENDPOINT
          value: unix:///csi/csi-addons.sock
        image: quay.io/cephcsi/cephcsi:v3.18.1
        imagePullPolicy: IfNotPresent
        name: csi-rbdplugin
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /dev
          name: host-dev
        - mountPath: /sys
          name: host-sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /etc/ceph-csi-config/
          name: ceph-csi-config
        - mountPath: /etc/ceph-csi-encryption-kms-config/
          name: ceph-csi-encryption-kms-config
        - mountPath: /tmp/csi/keys
          name: keys-tmp-dir
        - mountPath: /etc/ceph/
          name: ceph-config
        - mountPath: /run/secrets/tokens
          name: oidc-token
          readOnly: true
      - args:
        - --csi-address=$(ADDRESS)
        - --v=1
        - --timeout=150s
        - --retry-interval-start=500ms
        - --leader-election=true
        - --prevent-volume-mode-conversion=true
        - --default-fstype=ext4
        - --extra-create-metadata=true
        - --immediate-topology=false
        - --http-endpoint=$(POD_IP):8090
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
        imagePullPolicy: IfNotPresent
        name: csi-provisioner
        ports:
        - containerPort: 8090
          name: provisioner
          protocol: TCP
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=$(ADDRESS)
        - --v=1
        - --timeout=150s
        - --leader-election=true
        - --extra-create-metadata=true
        - --feature-gates=CSIVolumeGroupSnapshot=false
        - --http-endpoint=$(POD_IP):8092
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
        imagePullPolicy: IfNotPresent
        name: csi-snapshotter
        ports:
        - containerPort: 8092
          name: snapshotter
          protocol: TCP
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --v=1
        - --csi-address=$(ADDRESS)
        - --leader-election=true
        - --retry-interval-start=500ms
        - --default-fstype=ext4
        - --http-endpoint=$(POD_IP):8093
        env:
        - name: ADDRESS
          value: /csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
        imagePullPolicy: IfNotPresent
        name: csi-attacher
        ports:
        - containerPort: 8093
          name: attacher
          protocol: TCP
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=$(ADDRESS)
        - --v=1
        - --timeout=150s
        - --leader-election
        - --retry-interval-start=500ms
        - --handle-volume-inuse-error=false
        - --feature-gates=RecoverVolumeExpansionFailure=true
        - --http-endpoint=$(POD_IP):8091
        env:
        - name: ADDRESS
          value: unix:///csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
        imagePullPolicy: IfNotPresent
        name: csi-resizer
        ports:
        - containerPort: 8091
          name: resizer
          protocol: TCP
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --type=controller
        - --v=5
        - --drivername=rbd.csi.ceph.com
        - --drivernamespace=$(DRIVER_NAMESPACE)
        - --setmetadata=true
        env:
        - name: DRIVER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/cephcsi/cephcsi:v3.18.1
        imagePullPolicy: IfNotPresent
        name: csi-rbdplugin-controller
        volumeMounts:
        - mountPath: /etc/ceph-csi-config/
          name: ceph-csi-config
        - mountPath: /tmp/csi/keys
          name: keys-tmp-dir
        - mountPath: /etc/ceph/
          name: ceph-config
      - args:
        - --type=liveness
        - --endpoint=$(CSI_ENDPOINT)
        - --metricsport=8680
        - --metricspath=/metrics
        - --polltime=60s
        - --timeout=3s
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi-provisioner.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay.io/cephcsi/cephcsi:v3.18.1
        imagePullPolicy: IfNotPresent
        name: liveness-prometheus
        ports:
        - containerPort: 8680
          name: http-metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      priorityClassName: system-cluster-critical
      serviceAccountName: rbd-csi-provisioner
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /dev
        name: host-dev
      - hostPath:
          path: /sys
        name: host-sys
      - hostPath:
          path: /lib/modules
        name: lib-modules
      - emptyDir:
          medium: Memory
        name: socket-dir
      - configMap:
          name: ceph-config
        name: ceph-config
      - configMap:
          name: ceph-csi-config
        name: ceph-csi-config
      - configMap:
          name: ceph-csi-encryption-kms-config
        name: ceph-csi-encryption-kms-config
      - emptyDir:
          medium: Memory
        name: keys-tmp-dir
      - name: oidc-token
        projected:
          sources:
          - serviceAccountToken:
              audience: ceph-csi-kms
              expirationSeconds: 3600
              path: oidc-token
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-rbdplugin
  namespace: kocto-ceph-storage
spec:
  selector:
    matchLabels:
      app: csi-rbdplugin
  template:
    metadata:
      labels:
        app: csi-rbdplugin
    spec:
      containers:
      - args:
        - --nodeid=$(NODE_ID)
        - --pluginpath=/var/lib/kubelet/plugins
        - --stagingpath=/var/lib/kubelet/plugins/kubernetes.io/csi/
        - --type=rbd
        - --nodeserver=true
        - --endpoint=$(CSI_ENDPOINT)
        - --csi-addons-endpoint=$(CSI_ADDONS_ENDPOINT)
        - --v=5
        - --drivername=rbd.csi.ceph.com
        - --enableprofiling=false
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: CSI_ADDONS_ENDPOINT
          value: unix:///csi/csi-addons.sock
        image: quay.io/cephcsi/cephcsi:v3.18.1
        imagePullPolicy: IfNotPresent
        name: csi-rbdplugin
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /dev
          name: host-dev
        - mountPath: /sys
          name: host-sys
        - mountPath: /run/mount
          name: host-mount
        - mountPath: /etc/selinux
          name: etc-selinux
          readOnly: true
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /etc/ceph-csi-config/
          name: ceph-csi-config
        - mountPath: /etc/ceph-csi-encryption-kms-config/
          name: ceph-csi-encryption-kms-config
        - mountPath: /var/lib/kubelet/plugins
          mountPropagation: Bidirectional
          name: plugin-dir
        - mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
          name: mountpoint-dir
        - mountPath: /tmp/csi/keys
          name: keys-tmp-dir
        - mountPath: /var/log/ceph
          name: ceph-logdir
        - mountPath: /etc/ceph/
          name: ceph-config
        - mountPath: /run/secrets/tokens
          name: oidc-token
          readOnly: true
      - args:
        - --v=1
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/rbd.csi.ceph.com/csi.sock
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
        name: driver-registrar
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
      - args:
        - --type=liveness
        - --endpoint=$(CSI_ENDPOINT)
        - --metricsport=8680
        - --metricspath=/metrics
        - --polltime=60s
        - --timeout=3s
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay.io/cephcsi/cephcsi:v3.18.1
        imagePullPolicy: IfNotPresent
        name: liveness-prometheus
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      serviceAccountName: rbd-csi-nodeplugin
      tolerations:
      - operator: Exists
      volumes:
      - emptyDir: {}
        name: etc-selinux
      - hostPath:
          path: /var/lib/kubelet/kocto-ceph-log
          type: DirectoryOrCreate
        name: ceph-logdir
      - hostPath:
          path: /var/lib/kubelet/plugins/rbd.csi.ceph.com
          type: DirectoryOrCreate
        name: socket-dir
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: Directory
        name: plugin-dir
      - hostPath:
          path: /var/lib/kubelet/pods
          type: DirectoryOrCreate
        name: mountpoint-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry/
          type: Directory
        name: registration-dir
      - hostPath:
          path: /dev
        name: host-dev
      - hostPath:
          path: /sys
        name: host-sys
      - hostPath:
          path: /run/mount
        name: host-mount
      - hostPath:
          path: /lib/modules
        name: lib-modules
      - configMap:
          name: ceph-config
        name: ceph-config
      - configMap:
          name: ceph-csi-config
        name: ceph-csi-config
      - configMap:
          name: ceph-csi-encryption-kms-config
        name: ceph-csi-encryption-kms-config
      - emptyDir:
