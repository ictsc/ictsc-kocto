apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: plugin
    app.kubernetes.io/instance: hostpath.csi.k8s.io
    app.kubernetes.io/name: csi-hostpathplugin
    app.kubernetes.io/part-of: csi-driver-host-path
  name: csi-hostpathplugin
  namespace: kocto-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: plugin
      app.kubernetes.io/instance: hostpath.csi.k8s.io
      app.kubernetes.io/name: csi-hostpathplugin
      app.kubernetes.io/part-of: csi-driver-host-path
  serviceName: csi-hostpathplugin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plugin
        app.kubernetes.io/instance: hostpath.csi.k8s.io
        app.kubernetes.io/name: csi-hostpathplugin
        app.kubernetes.io/part-of: csi-driver-host-path
    spec:
      containers:
      - args:
        - --drivername=hostpath.csi.k8s.io
        - --v=5
        - --endpoint=$(CSI_ENDPOINT)
        - --nodeid=$(KUBE_NODE_NAME)
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: ghcr.io/ictsc/ictsc-kocto:storage-1b1f15878e3b37fd35deb61f7582c4a38eff6aa5
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 2
          timeoutSeconds: 3
        name: hostpath
        ports:
        - containerPort: 9898
          name: healthz
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
          name: mountpoint-dir
        - mountPath: /var/lib/kubelet/plugins
          mountPropagation: Bidirectional
          name: plugins-dir
        - mountPath: /csi-data-dir
          name: csi-data-dir
        - mountPath: /dev
          name: dev-dir
      - args:
        - --v=5
        - --csi-address=$(ADDRESS)
        - --leader-election
        env:
        - name: ADDRESS
          value: /csi/csi.sock
        image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
        imagePullPolicy: IfNotPresent
        name: csi-external-health-monitor-controller
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --v=5
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/csi-hostpath/csi.sock
        - --http-endpoint=:9809
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: registrar-probe
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 15
        name: node-driver-registrar
        ports:
        - containerPort: 9809
          name: registrar-probe
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
        - mountPath: /csi-data-dir
          name: csi-data-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --health-port=9898
        image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
        name: liveness-probe
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --v=5
        - --csi-address=/csi/csi.sock
        image: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
        name: csi-attacher
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - -v=5
        - --csi-address=/csi/csi.sock
        - --feature-gates=Topology=true
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
        name: csi-provisioner
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - -v=5
        - -csi-address=/csi/csi.sock
        image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
        name: csi-resizer
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - -v=5
        - --csi-address=/csi/csi.sock
        image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
        name: csi-snapshotter
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        kubernetes.io/hostname: test-talos-kocto-cp1
      serviceAccountName: csi-hostpathplugin-sa
      volumes:
      - hostPath:
